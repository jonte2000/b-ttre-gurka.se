<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana Spinner</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:#fff;
}

body{
    display:flex;
    align-items:center;
    justify-content:center;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
}

#game{
    width:100%;
    height:100%;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;
}

#banana{
    font-size:clamp(150px,25vw,260px);
    line-height:1;

    cursor:pointer;

    touch-action:manipulation;

    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;

    outline:none !important;
    border:none;

    -webkit-tap-highlight-color:transparent;

    will-change:transform;

    transform-origin:center;
}

#banana:focus,
#banana:focus-visible,
#banana:active{
    outline:none !important;
    box-shadow:none !important;
}

#stats{
    position:absolute;

    left:12px;
    right:12px;
    bottom:18px;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:14px;
    flex-wrap:wrap;

    font:16px Arial,sans-serif;

    color:#222;

    pointer-events:none;
}

#stats span{
    white-space:nowrap;
}
</style>
</head>

<body>

<div id="game">

    <div id="banana">🍌</div>

    <div id="stats">
        <span id="count">0</span>
        <span id="rate">0.0</span>
    </div>

</div>

<script>
(() => {

    const banana =
        document.getElementById("banana");

    const countDisplay =
        document.getElementById("count");

    const rateDisplay =
        document.getElementById("rate");


    const SAVE_KEY =
        "banana-spinner-save-v9";


    let angle = 0;

    let speed = 0;

    let spins = 0;

    let lastTime =
        performance.now();

    let lastSave = 0;


    /*
    ==============================
    LOAD SAVE
    ==============================
    */

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(
                    SAVE_KEY
                )
            );

        if(saved){

            if(Number.isFinite(saved.angle))
                angle = saved.angle;

            if(Number.isFinite(saved.speed))
                speed = Math.max(
                    0,
                    saved.speed
                );

            if(Number.isFinite(saved.spins))
                spins = Math.max(
                    0,
                    Math.floor(saved.spins)
                );
        }

    }catch(_){}


    /*
    ==============================
    NUMBER FORMAT
    ==============================
    */

    function formatNumber(n){

        n = Math.max(
            0,
            Math.floor(n)
        );

        if(n >= 1000000000){

            return (
                n / 1000000000
            )
            .toFixed(
                n >= 10000000000
                    ? 0
                    : 1
            )
            .replace(/\.0$/,"")
            + "B";
        }


        if(n >= 1000000){

            return (
                n / 1000000
            )
            .toFixed(
                n >= 10000000
                    ? 0
                    : 1
            )
            .replace(/\.0$/,"")
            + "M";
        }


        if(n >= 1000){

            return (
                n / 1000
            )
            .toFixed(
                n >= 10000
                    ? 0
                    : 1
            )
            .replace(/\.0$/,"")
            + "K";
        }


        return n.toLocaleString("en-US");
    }


    /*
    ==============================
    ADD SPEED
    ==============================
    */

    function addSpeed(){

        speed += 110;

    }


    /*
    ==============================
    INITIAL DISPLAY
    ==============================
    */

    countDisplay.textContent =
        formatNumber(spins);


    /*
    ==============================
    BANANA CLICK
    ==============================
    */

    banana.addEventListener(
        "pointerdown",
        (event) => {

            event.preventDefault();

            addSpeed();

        }
    );


    /*
    ==============================
    PREVENT DRAGGING
    ==============================
    */

    banana.addEventListener(
        "dragstart",
        (event) => {

            event.preventDefault();

        }
    );


    /*
    ==============================
    SPACE / ENTER
    ==============================

    !event.repeat is the important
    part.

    Holding the key will NOT
    repeatedly add speed.
    ==============================
    */

    document.addEventListener(
        "keydown",
        (event) => {

            if(
                (
                    event.code === "Space" ||
                    event.code === "Enter"
                ) &&
                !event.repeat
            ){

                event.preventDefault();

                addSpeed();

            }

        }
    );


    /*
    ==============================
    SAVE
    ==============================
    */

    function save(){

        try{

            localStorage.setItem(
                SAVE_KEY,
                JSON.stringify({
                    angle,
                    speed,
                    spins
                })
            );

        }catch(_){}

    }


    /*
    ==============================
    GAME LOOP
    ==============================
    */

    function animate(now){

        const dt =
            Math.min(
                (now - lastTime) / 1000,
                0.05
            );

        lastTime = now;


        /*
        ROTATION
        */

        angle +=
            speed * dt;


        /*
        COMPLETED SPINS
        */

        const completed =
            Math.floor(
                angle / 360
            );


        if(completed > spins){

            spins = completed;

            countDisplay.textContent =
                formatNumber(spins);

        }


        /*
        DRAW BANANA
        */

        banana.style.transform =
            `rotate(${angle}deg)`;


        /*
        FRICTION

        Stronger when the banana
        gets close to stopping.
        */

        const friction =
            35 +
            Math.max(
                0,
                8 - speed / 25
            ) * 8;


        speed =
            Math.max(
                0,
                speed - friction * dt
            );


        /*
        SPEED DISPLAY
        */

        rateDisplay.textContent =
            (speed / 360).toFixed(1);


        /*
        AUTOSAVE
        */

        if(
            now - lastSave >= 1000
        ){

            save();

            lastSave = now;

        }


        requestAnimationFrame(
            animate
        );

    }


    /*
    ==============================
    SAVE WHEN LEAVING
    ==============================
    */

    window.addEventListener(
        "beforeunload",
        save
    );


    /*
    ==============================
    START
    ==============================
    */

    requestAnimationFrame(
        animate
    );

})();
</script>

</body>
</html>
