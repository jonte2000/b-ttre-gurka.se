<script>
(() => {
  const banana = document.getElementById("banana");
  const countDisplay = document.getElementById("count");
  const rateDisplay = document.getElementById("rate");

  const SAVE_KEY = "banana-spin-save-v7";

  let angle = 0;
  let speed = 0;
  let spins = 0;

  let lastTime = performance.now();
  let lastSave = 0;

  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));

    if (saved) {
      angle = Number.isFinite(saved.angle) ? saved.angle : 0;
      speed = Number.isFinite(saved.speed) ? Math.max(0, saved.speed) : 0;
      spins = Number.isFinite(saved.spins)
        ? Math.max(0, Math.floor(saved.spins))
        : 0;
    }
  } catch (e) {}

  function formatNumber(n) {
    n = Math.max(0, Math.floor(n));

    if (n >= 1000000000) {
      return (n / 1000000000)
        .toFixed(n >= 10000000000 ? 0 : 1)
        .replace(/\.0$/, "") + "B";
    }

    if (n >= 1000000) {
      return (n / 1000000)
        .toFixed(n >= 10000000 ? 0 : 1)
        .replace(/\.0$/, "") + "M";
    }

    return n.toLocaleString("en-US");
  }

  countDisplay.textContent = formatNumber(spins);

  function addSpeed() {
    speed += 110;
  }

  // Mouse / touch / pen
  banana.addEventListener("pointerdown", e => {
    e.preventDefault();
    addSpeed();
  });

  // Prevent dragging
  banana.addEventListener("dragstart", e => {
    e.preventDefault();
  });

  // Space works anywhere on the page
  document.addEventListener("keydown", e => {
    if (e.code === "Space") {
      e.preventDefault();
      addSpeed();
    }
  });

  // Enter also works
  document.addEventListener("keydown", e => {
    if (e.code === "Enter") {
      e.preventDefault();
      addSpeed();
    }
  });

  function animate(now) {
    const dt = Math.min(
      (now - lastTime) / 1000,
      0.05
    );

    lastTime = now;

    angle += speed * dt;

    // Count only completed 360° rotations
    const completed = Math.floor(angle / 360);

    if (completed > spins) {
      spins = completed;
      countDisplay.textContent = formatNumber(spins);
    }

    /*
      Faster while clicking:
      low friction at high speed.

      When you stop clicking:
      friction increases as the speed drops,
      making the banana stop relatively quickly.
    */
    const friction =
      35 + Math.max(0, 8 - speed / 25) * 8;

    speed = Math.max(
      0,
      speed - friction * dt
    );

    rateDisplay.textContent =
      (speed / 360).toFixed(1);

    banana.style.transform =
      `rotate(${angle}deg)`;

    if (now - lastSave > 1000) {
      try {
        localStorage.setItem(
          SAVE_KEY,
          JSON.stringify({
            angle,
            speed,
            spins
          })
        );
      } catch (e) {}

      lastSave = now;
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
