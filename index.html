<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana Spinner</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #fff;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-user-select: none;
  }

  #game {
    width: 100%;
    height: 100%;
    min-height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  #banana {
    font-size: clamp(150px, 25vw, 260px);
    line-height: 1;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    will-change: transform;
    transform-origin: center;
  }

  #counter {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font: 16px Arial, sans-serif;
    color: #222;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="game">
  <div id="banana" role="button" tabindex="0" aria-label="Spin banana">🍌</div>
  <div id="counter" aria-live="polite">0</div>
</div>

<script>
(() => {
  const banana = document.getElementById("banana");
  const counter = document.getElementById("counter");

  const SAVE_KEY = "banana-spin-save-v1";

  let angle = 0;
  let speed = 0;
  let spins = 0;
  let lastTime = performance.now();
  let lastSave = 0;

  // Load saved progress.
  try {
    const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (saved) {
      if (Number.isFinite(saved.angle)) angle = saved.angle;
      if (Number.isFinite(saved.speed)) speed = saved.speed;
      if (Number.isFinite(saved.spins)) spins = saved.spins;
      counter.textContent = spins;
    }
  } catch (_) {}

  function save() {
    try {
      localStorage.setItem(
        SAVE_KEY,
        JSON.stringify({ angle, speed, spins })
      );
    } catch (_) {}
  }

  // Every click adds momentum. There is no maximum speed.
  function addSpeed() {
    speed += 110;
  }

  banana.addEventListener("pointerdown", (event) => {
    event.preventDefault();
    addSpeed();
  });

  banana.addEventListener("dragstart", (event) => {
    event.preventDefault();
  });

  banana.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      addSpeed();
    }
  });

  function animate(now) {
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;

    // Rotate according to current momentum.
    angle += speed * dt;

    // Count one spin for every completed 360°.
    const completedSpins = Math.floor(angle / 360);

    if (completedSpins > spins) {
      spins = completedSpins;
      counter.textContent = spins;
    }

    banana.style.transform = `rotate(${angle}deg)`;

    // Linear friction: it gradually slows all the way to a stop.
    const friction = 35;
    speed = Math.max(0, speed - friction * dt);

    // Save roughly once per second.
    if (now - lastSave > 1000) {
      save();
      lastSave = now;
    }

    requestAnimationFrame(animate);
  }

  window.addEventListener("beforeunload", save);

  requestAnimationFrame(animate);
})();
</script>

</body>
</html>
