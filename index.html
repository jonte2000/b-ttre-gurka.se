<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banana Spinner</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff}
body{display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#game{width:100%;height:100%;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
#banana{font-size:clamp(150px,25vw,260px);line-height:1;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;outline:none!important;border:none;-webkit-tap-highlight-color:transparent;will-change:transform}
#banana:focus,#banana:focus-visible,#banana:active{outline:none!important;box-shadow:none!important}
#stats{position:absolute;left:12px;right:12px;bottom:18px;display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;font:16px Arial,sans-serif;color:#222;pointer-events:none}
#stats span{white-space:nowrap}
</style>
</head>
<body>
<div id="game">
  <div id="banana">🍌</div>
  <div id="stats"><span id="count">0</span><span id="rate">0.0</span></div>
</div>
<script>
(() => {
  const banana=document.getElementById("banana");
  const countDisplay=document.getElementById("count");
  const rateDisplay=document.getElementById("rate");
  const SAVE_KEY="banana-spinner-save-v8";

  let angle=0,speed=0,spins=0,lastTime=performance.now(),lastSave=0;

  try{
    const saved=JSON.parse(localStorage.getItem(SAVE_KEY));
    if(saved){
      if(Number.isFinite(saved.angle)) angle=saved.angle;
      if(Number.isFinite(saved.speed)) speed=Math.max(0,saved.speed);
      if(Number.isFinite(saved.spins)) spins=Math.max(0,Math.floor(saved.spins));
    }
  }catch(_){}

  function formatNumber(n){
    n=Math.max(0,Math.floor(n));
    if(n>=1000000000)return(n/1000000000).toFixed(n>=10000000000?0:1).replace(/\.0$/,"")+"B";
    if(n>=1000000)return(n/1000000).toFixed(n>=10000000?0:1).replace(/\.0$/,"")+"M";
    return n.toLocaleString("en-US");
  }

  function addSpeed(){speed+=110}

  countDisplay.textContent=formatNumber(spins);

  banana.addEventListener("pointerdown",e=>{
    e.preventDefault();
    addSpeed();
  });

  banana.addEventListener("dragstart",e=>e.preventDefault());

  document.addEventListener("keydown",e=>{
    if(e.code==="Space"||e.code==="Enter"){
      e.preventDefault();
      addSpeed();
    }
  });

  function save(){
    try{
      localStorage.setItem(SAVE_KEY,JSON.stringify({angle,speed,spins}));
    }catch(_){}
  }

  function animate(now){
    const dt=Math.min((now-lastTime)/1000,.05);
    lastTime=now;

    angle+=speed*dt;

    const completed=Math.floor(angle/360);
    if(completed>spins){
      spins=completed;
      countDisplay.textContent=formatNumber(spins);
    }

    // Friction increases as speed gets lower.
    const friction=35+Math.max(0,8-speed/25)*8;
    speed=Math.max(0,speed-friction*dt);

    rateDisplay.textContent=(speed/360).toFixed(1);
    banana.style.transform=`rotate(${angle}deg)`;

    if(now-lastSave>=1000){
      save();
      lastSave=now;
    }

    requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
